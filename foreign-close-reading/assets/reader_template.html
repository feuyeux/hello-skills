<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<script>
/* 主题必须在首次绘制前定好，避免闪白 */
(function () {
  try {
    var t = localStorage.getItem('fcr-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
:root{
  --font-ui:system-ui,-apple-system,'Segoe UI','Noto Sans CJK SC',
    'PingFang SC','Microsoft YaHei',sans-serif;
  --serif-latin:Georgia,'Iowan Old Style','Times New Roman',serif;
  --serif-cyrl:'PT Serif','Noto Serif','Charter','Georgia','Times New Roman',serif;
  --serif-cjk:'Songti SC','SimSun','Source Han Serif SC','Noto Serif CJK SC',serif;
  --serif-jp:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif CJK JP',
    'Source Han Serif JP','MS Mincho',serif;
  --serif-kr:'Apple SD Gothic Neo','Noto Serif CJK KR','Nanum Myeongjo',
    'Batang','Malgun Gothic',serif;
  --mono:Consolas,'SF Mono','DejaVu Sans Mono',monospace;
  --lead:2;     /* 行高 */
  --size:19px;
}

/* ── 纸 ───────────────────────────────────────────── */
[data-theme="paper"]{
  --paper:#f6f1e7; --paper2:#efe7d8; --ink:#33302a; --muted:#8a8172;
  --accent:#b3552e; --accent-soft:rgba(179,85,46,.13); --card:#fffdf7;
  --line:#e3dac8; --shadow:0 4px 18px rgba(60,44,20,.08);
}
[data-theme="ink"]{
  --paper:#181612; --paper2:#201d18; --ink:#d6cfc2; --muted:#8f887b;
  --accent:#e08a5f; --accent-soft:rgba(224,138,95,.16); --card:#211e18;
  --line:#3a352b; --shadow:0 6px 22px rgba(0,0,0,.4);
}
[data-theme="sepia"]{
  --paper:#e9d7b6; --paper2:#e0caa3; --ink:#3d2f1c; --muted:#846f4e;
  --accent:#95521f; --accent-soft:rgba(149,82,31,.14); --card:#f5e8cd;
  --line:#cdb188; --shadow:0 4px 18px rgba(90,60,20,.12);
}
[data-theme="mist"]{
  --paper:#eef1f4; --paper2:#e5eaef; --ink:#2c3339; --muted:#7b858e;
  --accent:#2f6d8f; --accent-soft:rgba(47,109,143,.12); --card:#fbfcfd;
  --line:#d5dce2; --shadow:0 4px 18px rgba(30,50,70,.08);
}
[data-theme="night"]{
  --paper:#151b21; --paper2:#1b222a; --ink:#cdd6de; --muted:#7f8b96;
  --accent:#5fb3d4; --accent-soft:rgba(95,179,212,.15); --card:#1c232b;
  --line:#2d3742; --shadow:0 6px 22px rgba(0,0,0,.42);
}
[data-theme="forest"]{
  --paper:#eef0e6; --paper2:#e5e8db; --ink:#2f3428; --muted:#767c68;
  --accent:#4a6b3f; --accent-soft:rgba(74,107,63,.13); --card:#f7f8f1;
  --line:#d6dac7; --shadow:0 4px 18px rgba(40,55,30,.09);
}
[data-theme="rose"]{
  --paper:#f8eeee; --paper2:#f1e2e2; --ink:#3a2f30; --muted:#8d7679;
  --accent:#a8475b; --accent-soft:rgba(168,71,91,.12); --card:#fdf8f8;
  --line:#e6d2d4; --shadow:0 4px 18px rgba(90,40,50,.08);
}
[data-theme="slate"]{
  --paper:#191c22; --paper2:#20242c; --ink:#c9cfd8; --muted:#818a97;
  --accent:#8f9dff; --accent-soft:rgba(143,157,255,.15); --card:#20242c;
  --line:#313742; --shadow:0 6px 22px rgba(0,0,0,.45);
}
[data-theme="solar"]{
  --paper:#fdf6e3; --paper2:#f5edd8; --ink:#4a4535; --muted:#8f8a72;
  --accent:#b58900; --accent-soft:rgba(181,137,0,.14); --card:#fffbef;
  --line:#e7dcc0; --shadow:0 4px 18px rgba(120,100,40,.1);
}
[data-theme="contrast"]{
  --paper:#ffffff; --paper2:#f2f2f2; --ink:#111111; --muted:#666666;
  --accent:#0b5fff; --accent-soft:rgba(11,95,255,.12); --card:#ffffff;
  --line:#d8d8d8; --shadow:0 4px 18px rgba(0,0,0,.12);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; background:var(--paper)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif-latin); font-size:var(--size); line-height:var(--lead);
  font-kerning:normal; text-rendering:optimizeLegibility;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  transition:background .25s ease, color .25s ease;
}

/* ── 顶栏 ─────────────────────────────────────────── */
#bar{position:fixed; top:0; left:0; right:0; height:3px; z-index:9;
  background:transparent}
#bar i{display:block; height:100%; width:0; background:var(--accent);
  transition:width .4s ease}
#tools{position:fixed; top:12px; right:14px; z-index:12; display:flex; gap:8px}
.tbtn{
  font:500 12.5px/1 var(--font-ui); color:var(--muted); cursor:pointer;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  border:1px solid var(--line); border-radius:999px; padding:8px 12px;
  backdrop-filter:blur(6px); box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
}
.tbtn:hover{color:var(--ink); border-color:var(--accent)}
.tbtn.wide{padding:8px 10px}
#panel{
  position:fixed; top:52px; right:14px; z-index:12; width:280px; max-width:calc(100vw - 28px);
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:14px 16px 16px;
  font-family:var(--font-ui); font-size:13px; color:var(--ink);
  max-height:calc(100vh - 72px); overflow:auto;
}
#panel[hidden]{display:none}
#panel h4{margin:0 0 10px; font-size:12px; letter-spacing:.14em;
  color:var(--accent); font-weight:600}
#panel .grp{margin:0 0 14px}
#panel .grp:last-child{margin-bottom:0}
#panel label{display:block; color:var(--muted); margin-bottom:6px;
  font-size:11.5px; letter-spacing:.06em}
#panel .seg{display:flex; gap:6px; flex-wrap:wrap}
#panel .seg button{
  font:500 12px/1 var(--font-ui); cursor:pointer; color:var(--ink);
  background:var(--paper2); border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; min-width:34px;
}
#panel .seg button[aria-pressed="true"]{border-color:var(--accent);
  background:var(--accent-soft); color:var(--accent); font-weight:700}
.sw{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.sw button{
  display:flex; align-items:center; gap:8px; cursor:pointer; text-align:left;
  font:500 12px/1.2 var(--font-ui); color:var(--ink);
  background:var(--paper2); border:1px solid var(--line); border-radius:9px;
  padding:7px 9px;
}
.sw button[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset}
.sw .dot{width:16px; height:16px; border-radius:50%; flex:0 0 auto;
  border:1px solid rgba(0,0,0,.18)}
.sw .dot i{display:block; width:100%; height:100%; border-radius:50%;
  background:var(--ink); clip-path:polygon(100% 0,100% 100%,0 100%)}
#panel .note{color:var(--muted); font-size:11.5px; line-height:1.6; margin-top:10px}

header{max-width:var(--measure,680px); margin:0 auto; padding:62px 24px 4px;
  text-align:center}
h1{font-size:25px; font-weight:600; margin:0; letter-spacing:.02em;
  line-height:1.55; font-family:var(--serif-latin)}
html[data-lang="cjk"] h1,html[data-lang="jpn"] h1,html[data-lang="kor"] h1{
  font-family:var(--serif-cjk)}
html[data-lang="jpn"] h1{font-family:var(--serif-jp)}
html[data-lang="kor"] h1{font-family:var(--serif-kr)}
#meta{color:var(--muted); font-size:13px; margin-top:8px;
  font-family:var(--font-ui); letter-spacing:.04em}
#tip{color:var(--muted); font-size:13.5px; margin-top:16px;
  font-family:var(--font-ui); transition:opacity 1.2s}
#tip .k{border:1px solid var(--line); border-radius:5px; padding:1px 7px;
  font-size:12px; background:var(--card)}
#tip.gone{opacity:0}

/* ── 正文 ─────────────────────────────────────────── */
main{max-width:var(--measure,680px); margin:0 auto; padding:30px 24px 150px}
p.par{margin:0 0 1.3em}
/* 增量生成时的结尾提示：书还没做完 */
p.more{margin:44px 0 20px; padding-top:18px; border-top:1px solid var(--line);
  text-align:center; color:var(--muted); font-size:13px; font-family:var(--font-ui)}

/* 文本语言排版：字号 / 行高 / 字距 / 字体 / 断行 */
html[data-lang="cjk"] main,html[data-lang="jpn"] main,html[data-lang="kor"] main{
  font-size:calc(var(--size) - 1px)}
html[data-lang="cjk"] main{font-family:var(--serif-cjk); line-height:calc(var(--lead) - .05)}
html[data-lang="jpn"] main{
  font-family:var(--serif-jp); line-height:calc(var(--lead) + .05);
  font-feature-settings:"palt" 1; line-break:strict;
}
html[data-lang="kor"] main{
  font-family:var(--serif-kr); line-height:calc(var(--lead) + .1);
  word-break:keep-all;
}
html[data-lang="latn"] main{font-family:var(--serif-latin); hyphens:auto}
html[data-lang="cyrl"] main{font-family:var(--serif-cyrl); hyphens:auto}
html[data-lang="rtl"] main{font-family:var(--serif-latin); direction:rtl; text-align:right}

.s{cursor:pointer; border-radius:4px; padding:1px 2px; transition:background .15s}
.s:hover{background:var(--accent-soft)}
.s:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* 学过的句子不画下划线、不加高亮、不插任何符号，只按设置压暗字色；
   正在读的那一句才有底色。 */
html[data-seen="dim"] .s.seen:not(.open){color:var(--muted)}
html[data-seen="none"] .s.seen:not(.open){color:inherit}
.s.open{background:var(--accent-soft); box-shadow:inset 0 -.5em 0 var(--accent-soft)}

/* ── 讲解卡片：紧贴被点句子下方 ────────────────────── */
.holder{display:block; margin:2px 0 14px}
.holder[hidden]{display:none}
.card{
  background:var(--card); border:1px solid var(--line);
  border-left:4px solid var(--accent); border-radius:10px;
  padding:16px 22px 12px; margin:0;
  box-shadow:var(--shadow);
  animation:pop .18s ease-out; font-size:16px; line-height:1.85;
  font-family:var(--serif-latin);
}
/* 卡片里写的是中文讲解，中文（SC）字形优先；被讲解的外文词条
   再由下面的规则换回原语言字体，日文汉字不会串成简体字形 */
.card{font-family:var(--serif-cjk)}
html[data-lang="latn"] .card{font-family:var(--serif-cjk)}
html[data-lang="jpn"] .w .wd,html[data-lang="jpn"] .trans{font-family:var(--serif-jp)}
html[data-lang="kor"] .w .wd{font-family:var(--serif-kr)}
html[data-lang="cyrl"] .w .wd{font-family:var(--serif-cyrl)}
html[data-lang="latn"] .w .wd{font-family:var(--serif-latin)}
html[data-lang="jpn"] .g .frag,html[data-lang="cyrl"] .g .frag{font-family:inherit}
@keyframes pop{from{opacity:0; transform:translateY(-4px)} to{opacity:1}}
.card .x{float:right; cursor:pointer; color:var(--muted);
  font-family:var(--font-ui); font-size:14px;
  border:none; background:none; padding:4px 8px; margin:-4px -8px 0 0}
.card .x:hover{color:var(--ink)}
.trans{margin:2px 0 4px; font-size:17px}
h3{font:600 12px/1.4 var(--font-ui); color:var(--accent);
  letter-spacing:.14em; margin:18px 0 8px}
.w{display:flex; gap:16px; padding:8px 0; border-bottom:1px dashed var(--line)}
.w:last-child{border-bottom:none}
.w .wd{flex:0 0 34%; min-width:0; overflow-wrap:break-word}
.w .wd b{font-size:17px; font-weight:600}
.w .ph{color:var(--muted); font-size:13px; font-family:var(--mono);
  overflow-wrap:break-word}
.w .mn{flex:1; min-width:0}
.w .note{color:var(--muted); font-size:14px; margin-top:2px}
.g{margin:10px 0; overflow-wrap:break-word}
.g b{color:var(--accent)}
.c{margin:12px 0; padding-left:14px; border-left:2px solid var(--line);
  overflow-wrap:break-word}
.c b{color:var(--accent)}
/* 母语者视角：与文化同款引用线，但语义是“听感/口语对应”，不是典故 */
.n{margin:12px 0; padding-left:14px; border-left:2px solid var(--line);
  overflow-wrap:break-word}
.n b{color:var(--accent)}

footer{max-width:var(--measure,680px); margin:0 auto; padding:0 24px 60px;
  text-align:center; color:var(--muted); font-size:12px;
  font-family:var(--font-ui)}

@media (max-width:480px){
  body{--size:17px}
  header{padding-top:56px}
  main{padding-left:18px; padding-right:18px}
  .w{flex-direction:column; gap:2px}
  #tools{top:8px; right:8px}
  .tbtn{padding:7px 10px; font-size:12px}
}
@media print{
  #tools,#panel,#bar,footer,#tip{display:none}
  .s.seen:not(.open){color:inherit}
  .s.open{background:none; box-shadow:none}
}
</style>
</head>
<body>
<div id="bar"><i></i></div>

<div id="tools">
  <button class="tbtn" id="t-theme" title="切换主题">🎨 <span id="t-theme-name">纸</span></button>
  <button class="tbtn wide" id="t-more" title="字号与版心">Aa</button>
</div>

<div id="panel" hidden>
  <div class="grp">
    <h4>主题</h4>
    <div class="sw" id="sw"></div>
  </div>
  <div class="grp">
    <h4>字号</h4>
    <div class="seg" id="seg-size"></div>
  </div>
  <div class="grp">
    <h4>行距</h4>
    <div class="seg" id="seg-lead"></div>
  </div>
  <div class="grp">
    <h4>版心</h4>
    <div class="seg" id="seg-measure"></div>
  </div>
  <div class="grp">
    <h4>已读标记</h4>
    <div class="seg" id="seg-seen"></div>
  </div>
  <div class="grp">
    <h4>样式</h4>
    <div class="seg" id="seg-reset"></div>
  </div>
  <p class="note">设置与阅读进度都存在本机浏览器里，不会上传。</p>
</div>

<header>
  <h1></h1>
  <div id="meta"></div>
  <p id="tip">点击任意一句，讲解就地展开 <span class="k">←</span> <span class="k">→</span> 逐句往下读</p>
</header>
<main id="book"></main>
<footer>foreign-close-reading · 阅读进度与外观设置已保存在本机</footer>
<script type="application/json" id="data">__DATA__</script>
<script>
var DATA = JSON.parse(document.getElementById('data').textContent);
/* 进度键用全题名+副题名的短哈希：同一本书分卷生成多个阅读器时，
   旧键只截 title 前 48 字符，会互相串进度。旧键数据仍要能读回来。 */
function keyHash(s) {
  var h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
var BOOK_KEY = 'fcr-seen-' + keyHash((DATA.title || 'book') + '\u0000' + (DATA.subtitle || ''));
var LEGACY_KEY = 'fcr-seen-' + (DATA.title || 'book').slice(0, 48);
var CFG_KEY = 'fcr-prefs';
var THEME_KEY = 'fcr-theme';
var book = document.getElementById('book');
var bar = document.querySelector('#bar i');
var meta = document.getElementById('meta');
var tip = document.getElementById('tip');
var root = document.documentElement;

/* ── 语言适配 ─────────────────────────────────────── */
function normLang(v) {
  var s = String(v == null ? '' : v).toLowerCase().trim();
  if (!s) return '';
  var m = {
    /* 排版族名本身：sentences.json 的 layout 字段可以直接透传 */
    latn: 'latn', cyrl: 'cyrl', cjk: 'cjk', jpn: 'jpn', kor: 'kor', rtl: 'rtl',
    latin: 'latn', cyrillic: 'cyrl',
    ru: 'cyrl', russian: 'cyrl', russkiy: 'cyrl', 'русский': 'cyrl', '俄语': 'cyrl',
    uk: 'cyrl', ukrainian: 'cyrl', bg: 'cyrl', sr: 'cyrl',
    ja: 'jpn', jp: 'jpn', japanese: 'jpn', '日本語': 'jpn',
    '日语': 'jpn', '日文': 'jpn',
    ko: 'kor', kr: 'kor', korean: 'kor', '한국어': 'kor',
    '조선어': 'kor', '韩语': 'kor', '韓語': 'kor', '韩文': 'kor',
    zh: 'cjk', cn: 'cjk', chinese: 'cjk', '中文': 'cjk',
    '汉语': 'cjk', '漢語': 'cjk', zhcn: 'cjk', zhtw: 'cjk',
    en: 'latn', eng: 'latn', english: 'latn',
    fr: 'latn', de: 'latn', es: 'latn', it: 'latn', pt: 'latn', nl: 'latn',
    sv: 'latn', pl: 'latn', cs: 'latn', tr: 'latn', vi: 'latn', id: 'latn',
    la: 'latn', ro: 'latn', hu: 'latn', fi: 'latn', da: 'latn', no: 'latn',
    el: 'cyrl', ar: 'rtl', he: 'rtl', fa: 'rtl', ur: 'rtl'
  };
  return m[s] || 'latn';
}
var LANG = normLang(DATA.lang);
/* 没写 lang 也不至于出错：按正文脚本自己认 */
if (!LANG) {
  var probe = '', i;
  for (i = 0; i < DATA.sentences.length && probe.length < 400; i++)
    probe += (DATA.sentences[i].text || '');
  if (/[\u3040-\u30ff]/.test(probe)) LANG = 'jpn';
  else if (/[\uac00-\ud7af\u1100-\u11ff]/.test(probe)) LANG = 'kor';
  else if (/[\u0400-\u04ff]/.test(probe)) LANG = 'cyrl';
  else if (/[\u4e00-\u9fff]/.test(probe)) LANG = 'cjk';
  else if (/[\u0590-\u05ff\u0600-\u06ff]/.test(probe)) LANG = 'rtl';
  else LANG = 'latn';
}
root.setAttribute('data-lang', LANG);
/* 句间是否加空格：中日韩不加，其余加 */
var SEP = /^(cjk|jpn|kor)$/.test(LANG) ? '' : ' ';

/* ── 外观设置 ─────────────────────────────────────── */
var THEMES = [
  { id: 'paper', name: '纸', en: 'Paper', paper: '#f6f1e7', ink: '#33302a', accent: '#b3552e' },
  { id: 'ink', name: '墨夜', en: 'Ink Night', paper: '#181612', ink: '#d6cfc2', accent: '#e08a5f' },
  { id: 'sepia', name: '旧书', en: 'Sepia', paper: '#e9d7b6', ink: '#3d2f1c', accent: '#95521f' },
  { id: 'mist', name: '青雾', en: 'Mist', paper: '#eef1f4', ink: '#2c3339', accent: '#2f6d8f' },
  { id: 'night', name: '深海', en: 'Deep', paper: '#151b21', ink: '#cdd6de', accent: '#5fb3d4' },
  { id: 'forest', name: '苔绿', en: 'Moss', paper: '#eef0e6', ink: '#2f3428', accent: '#4a6b3f' },
  { id: 'rose', name: '藕粉', en: 'Rose', paper: '#f8eeee', ink: '#3a2f30', accent: '#a8475b' },
  { id: 'slate', name: '石板', en: 'Slate', paper: '#191c22', ink: '#c9cfd8', accent: '#8f9dff' },
  { id: 'solar', name: '日晒', en: 'Solar', paper: '#fdf6e3', ink: '#4a4535', accent: '#b58900' },
  { id: 'contrast', name: '高对比', en: 'Contrast', paper: '#ffffff', ink: '#111111', accent: '#0b5fff' }
];
var SIZES = [['小', 17], ['标准', 19], ['大', 21], ['特大', 23]];
var LEADS = [['紧', 1.75], ['标准', 2], ['松', 2.25], ['很松', 2.5]];
var MEASURES = [['窄', 560], ['标准', 680], ['宽', 780], ['很宽', 900]];
var SEEN_STYLES = [['压暗', 'dim'], ['不标记', 'none']];

var prefs = null;
try { prefs = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch (e) {}
if (!prefs || typeof prefs !== 'object') prefs = {};
if (!THEMES.some(function (t) { return t.id === prefs.theme; })) prefs.theme = 'paper';
if (typeof prefs.size !== 'number') prefs.size = 19;
if (typeof prefs.lead !== 'number') prefs.lead = 2;
if (typeof prefs.measure !== 'number') prefs.measure = 680;
if (SEEN_STYLES.every(function (x) { return x[1] !== prefs.seen; })) prefs.seen = 'dim';

function applyPrefs() {
  root.setAttribute('data-theme', prefs.theme);
  root.setAttribute('data-seen', prefs.seen);
  root.style.setProperty('--size', prefs.size + 'px');
  root.style.setProperty('--lead', prefs.lead);
  root.style.setProperty('--measure', prefs.measure + 'px');
  var t = THEMES.filter(function (x) { return x.id === prefs.theme; })[0] || THEMES[0];
  document.getElementById('t-theme-name').textContent = t.name;
  [['sw', 'theme', THEMES], ['seg-size', 'size', SIZES],
   ['seg-lead', 'lead', LEADS], ['seg-measure', 'measure', MEASURES],
   ['seg-seen', 'seen', SEEN_STYLES]]
    .forEach(function (row) {
      var box = document.getElementById(row[0]);
      if (!box) return;
      Array.prototype.forEach.call(box.children, function (b) {
        b.setAttribute('aria-pressed', String(String(b.dataset.v) === String(prefs[row[1]])) );
      });
    });
  try { localStorage.setItem(THEME_KEY, prefs.theme); } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem(CFG_KEY, JSON.stringify(prefs)); } catch (e) {}
  applyPrefs();
}

(function buildPanel() {
  var sw = document.getElementById('sw');
  THEMES.forEach(function (t) {
    var b = document.createElement('button');
    b.dataset.v = t.id;
    b.title = t.name + ' / ' + t.en;
    b.innerHTML = '<span class="dot" style="background:' + t.paper +
      ';border-color:' + t.accent + '"><i style="background:' + t.ink + '"></i></span>' +
      '<span>' + t.name + '</span>';
    b.onclick = function () { prefs.theme = t.id; savePrefs(); };
    sw.appendChild(b);
  });
  [['seg-size', SIZES, 'size'], ['seg-lead', LEADS, 'lead'],
   ['seg-measure', MEASURES, 'measure'], ['seg-seen', SEEN_STYLES, 'seen']]
    .forEach(function (row) {
    var box = document.getElementById(row[0]);
    row[1].forEach(function (pair) {
      var b = document.createElement('button');
      b.dataset.v = pair[1];
      b.textContent = pair[0];
      b.onclick = function () { prefs[row[2]] = pair[1]; savePrefs(); };
      box.appendChild(b);
    });
  });
  var rb = document.createElement('button');
  rb.textContent = '恢复默认';
  rb.onclick = function () {
    prefs = { theme: 'paper', size: 19, lead: 2, measure: 680, seen: 'dim' };
    savePrefs();
  };
  document.getElementById('seg-reset').appendChild(rb);

  var panel = document.getElementById('panel');
  document.getElementById('t-more').onclick = function () { panel.hidden = !panel.hidden; };
  document.getElementById('t-theme').onclick = function () {
    var i = 0;
    THEMES.forEach(function (t, k) { if (t.id === prefs.theme) i = k; });
    prefs.theme = THEMES[(i + 1) % THEMES.length].id;
    savePrefs();
  };
  document.addEventListener('click', function (e) {
    if (panel.hidden) return;
    if (panel.contains(e.target) || e.target.closest('#tools')) return;
    panel.hidden = true;
  });
})();
applyPrefs();

/* ── 正文渲染 ─────────────────────────────────────── */
document.querySelector('h1').textContent = DATA.title || '';
document.title = DATA.title || '精读';

var seen = {};
try {
  seen = JSON.parse(localStorage.getItem(BOOK_KEY)
                    || localStorage.getItem(LEGACY_KEY) || '{}');
} catch (e) {}
if (!seen || typeof seen !== 'object') seen = {};

var SENTS = {};
DATA.sentences.forEach(function (s) { SENTS[String(s.id)] = s; });

var cur = null, holder = null;
DATA.sentences.forEach(function (s) {
  if (!cur || String(s.para) !== String(cur.dataset.para)) {
    cur = document.createElement('p');
    cur.className = 'par';
    cur.dataset.para = s.para;
    book.appendChild(cur);
  }
  var sp = document.createElement('span');
  sp.className = 's' + (seen[s.id] ? ' seen' : '');
  sp.dataset.id = s.id;
  /* roving tabindex：整本书只有当前句在 Tab 序列里（读 500 句不用按 500 次 Tab），
     方向键推进时焦点跟着走，Enter/空格 打开当前句（见下方的 keydown） */
  sp.tabIndex = -1;
  sp.setAttribute('role', 'button');
  sp.textContent = (s.text == null ? '' : String(s.text)) + SEP;
  cur.appendChild(sp);
  /* 讲解占位符跟在句子后面、同一行流内：长段落里也就地展开在这句话下方 */
  holder = document.createElement('span');
  holder.className = 'holder';
  holder.dataset.for = s.id;
  holder.hidden = true;
  cur.appendChild(holder);
  sp._holder = holder;
});
/* ── roving tabindex：整本书只有当前句在 Tab 序列里 ── */
function rove(sp) {
  var all = book.querySelectorAll('.s');
  for (var i = 0; i < all.length; i++) all[i].tabIndex = -1;
  if (sp) sp.tabIndex = 0;
}
rove(book.querySelector('.s'));

/* ── 增量覆盖：书还没生成完时，告诉读者还剩多少 ───── */
var TOTAL = Number(DATA.total) || 0;
var PARTIAL = TOTAL > DATA.sentences.length;
if (PARTIAL) {
  var more = document.createElement('p');
  more.className = 'more';
  more.textContent = '本书共 ' + TOTAL + ' 句，这里生成了前 '
    + DATA.sentences.length + ' 句——对本 skill 说「继续」，即可生成下一批并合并进这个阅读器。';
  book.appendChild(more);
}

/* ── 渲染工具（缺字段不会出现 undefined） ──────────── */
var has = function (v) {
  return v !== null && v !== undefined && String(v).trim() !== '';
};
function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
  });
}
/* 数组 / 字典 / 单条目对象都能吃下：
   {t,d} 这样的一条笔记不再被误当成「词表」，{词: 释义} 这样的字典则展开成词条 */
var NOTE_T = ['t', 'title', 'name', 'point', 'topic', 'label', 'head'];
var NOTE_D = ['d', 'desc', 'detail', 'text', 'body', 'explain', 'm', 'note', 'content'];
var WORD_KEYS = ['w', 'word', 'term', 'phrase', 'vocab', 'p', 'ipa', 'phonetic',
                 'pron', 'reading', 'm', 'meaning', 'def', 'gloss'];
function arr(v) {
  if (!v) return [];
  if (Array.isArray(v)) {
    return v.filter(function (x) { return x && typeof x === 'object'; });
  }
  if (typeof v === 'object') {
    var keys = Object.keys(v);
    var single = keys.some(function (k) {
      return NOTE_T.indexOf(k) >= 0 || NOTE_D.indexOf(k) >= 0 || WORD_KEYS.indexOf(k) >= 0;
    });
    if (single) return [v];
    return keys.map(function (k) {
      var it = v[k];
      if (it && typeof it === 'object') {
        if (!has(it.w) && !has(it.t) && !has(it.word) && !has(it.title)) {
          it = Object.assign({ t: k }, it);
        }
        return it;
      }
      return { w: k, m: it };
    });
  }
  return [];
}
/* 无法识别的对象 → 按字段展开成「键：值」，认不出时宁可少写，也不吐 null/undefined */
function str(v) {
  if (v === null || v === undefined) return '';
  if (Array.isArray(v)) return v.map(str).filter(has).join('；');
  if (typeof v === 'object') {
    return Object.keys(v).map(function (k) {
      if (!has(v[k])) return '';
      var val = v[k];
      if (typeof val === 'object') val = pick(val, NOTE_D) || pick(val, NOTE_T) || '';
      return has(val) ? k + '：' + val : '';
    }).filter(has).join('；');
  }
  return String(v);
}
/* 兼容各种同义写法：meaning/def/explain、note/tip、example/eg… */
var pick = function (o, keys) {
  for (var i = 0; i < keys.length; i++) if (has(o[keys[i]])) return o[keys[i]];
  return '';
};

function wordHTML(w) {
  var head = pick(w, ['w', 'word', 'term', 'phrase', 'vocab', 'head', 'title']);
  var phon = pick(w, ['p', 'ipa', 'phonetic', 'pron', 'reading', 'pronunciation']);
  var mean = pick(w, ['m', 'meaning', 'mean', 'def', 'definition', 'gloss', 'translation', 'explain', 'sense']);
  var note = pick(w, ['n', 'note', 'notes', 'remark', 'usage', 'tip']);
  var ex = pick(w, ['ex', 'eg', 'example', 'examples', 'sent']);
  var h = '<div class="w"><div class="wd">';
  if (has(head)) h += '<b>' + esc(str(head)) + '</b>';
  if (has(phon)) h += ' <span class="ph">' + esc(str(phon)) + '</span>';
  h += '</div><div class="mn">';
  if (has(mean)) h += esc(str(mean));
  if (has(note)) h += '<div class="note">' + esc(str(note)) + '</div>';
  if (has(ex)) h += '<div class="note">例：' + esc(str(ex)) + '</div>';
  return h + '</div></div>';
}
/* 没有 w 字段的条目，把 m 里可能带的「词 —— 释义」拆出词头 */
function splitWord(o) {
  if (has(o.w) || has(o.word) || has(o.term) || has(o.phrase)) return o;
  var m = pick(o, ['m', 'meaning', 'def', 'definition', 'gloss']);
  if (!has(m)) return o;
  var parts = String(m).split(/\s*(?:——|--|—|\|)\s*/);
  if (parts.length >= 2 && parts[0].length <= 30) {
    var c = Object.assign({}, o);
    c.w = parts.shift().trim();
    c.m = parts.join(' —— ').trim();
    return c;
  }
  return o;
}

function cardHTML(s) {
  var h = '<button class="x" title="收起">✕</button>';
  var trans = pick(s, ['translation', 'trans', 'zh', 'translation_zh', 'cn']);
  var body = has(trans) ? str(trans) : '';
  if (!has(trans) && has(s.summary)) body = str(s.summary);
  h += '<p class="trans">' + (has(body) ? esc(body)
    : '<span style="color:var(--muted)">（这一句没有译文）</span>') + '</p>';

  var words = arr(pick(s, ['words', 'vocab', 'vocabulary', 'glossary', 'lexicon']))
    .map(splitWord)
    .filter(function (w) {
      return has(pick(w, ['w', 'word', 'term', 'phrase'])) ||
             has(pick(w, ['m', 'meaning', 'def', 'gloss']));
    });
  if (words.length) {
    h += '<h3>🔤 生词</h3>';
    words.forEach(function (w) { h += wordHTML(w); });
  }
  var grammar = noteList(pick(s, ['grammar', 'grammars', 'syntax', 'grammar_notes', 'points']))
    .filter(hasNote);
  if (grammar.length) {
    h += '<h3>🧩 语法</h3>';
    grammar.forEach(function (g) { h += noteHTML(g, 'g'); });
  }
  var culture = noteList(pick(s, ['culture', 'cultures', 'cultural', 'context', 'background', 'notes_culture']))
    .filter(hasNote);
  if (culture.length) {
    h += '<h3>🌍 文化</h3>';
    culture.forEach(function (c) { h += noteHTML(c, 'c'); });
  }
  var native = noteList(pick(s, ['native', 'native_note', 'native_notes',
                                 'native_speaker', 'as_a_native', 'natural']))
    .filter(hasNote);
  if (native.length) {
    h += '<h3>🗣 母语者</h3>';
    native.forEach(function (c) { h += noteHTML(c, 'n'); });
  }
  return h;
}

/* 语法 / 文化条目：字符串、{t,d}、字典、以及各种同义字段都能渲染；
   认不出的字段当补充行，一个字段都认不出时整条兜底成文本——绝不吐 undefined */
/* 空条目（{} / {t:null} / "" ）直接丢掉，别留下一个光秃秃的小标题 */
function hasNote(o) {
  if (typeof o === 'string') return has(o);
  if (!o || typeof o !== 'object') return false;
  return Object.keys(o).some(function (k) { return has(o[k]); });
}
function noteList(v) {
  if (!v) return [];
  if (Array.isArray(v)) {
    return v.filter(function (x) {
      return typeof x === 'string' ? has(x) : (x && typeof x === 'object');
    });
  }
  if (typeof v === 'string') return has(v) ? [v] : [];
  if (typeof v === 'object') return [v];
  return [];
}
function noteHTML(o, cls) {
  if (typeof o !== 'object' || o === null) {
    return '<div class="' + cls + '">' + esc(str(o)) + '</div>';
  }
  var t = pick(o, NOTE_T), d = pick(o, NOTE_D);
  var known = NOTE_T.concat(NOTE_D);
  var extra = '';
  Object.keys(o).forEach(function (k) {
    if (known.indexOf(k) >= 0) return;
    if (!has(o[k])) return;
    extra += '<div class="note">' + esc(k) + '：' + esc(str(o[k])) + '</div>';
  });
  if (!has(t) && !has(d)) {
    /* 字典形式 / 无已知字段：按字段逐行展开，别把键名当正文 */
    var lines = Object.keys(o).map(function (k) {
      if (!has(o[k])) return '';
      var v = o[k];
      if (typeof v === 'object') v = pick(v, NOTE_D) || pick(v, NOTE_T) || '';
      return has(v) ? (k + '：' + v) : '';
    }).filter(has);
    return '<div class="' + cls + '">' + esc(lines.join('；')) + '</div>';
  }
  return '<div class="' + cls + '">' +
    (has(t) ? '<b>' + esc(str(t)) + '</b>' + (cls === 'g' ? ' — ' : '<br>') : '') +
    esc(has(d) ? str(d) : '') + extra + '</div>';
}

/* ── 展开 / 收起 ──────────────────────────────────── */
var openSpan = null, openHolder = null;

function closeCard() {
  if (openHolder) {
    openHolder.hidden = true;
    openHolder.innerHTML = '';
  }
  if (openSpan) openSpan.classList.remove('open');
  openSpan = openHolder = null;
}
/* 键盘逐句推进时用，避免同一张卡反复重绘 */
function closeCardSoft() {
  if (openSpan) openSpan.classList.remove('open');
  openSpan = null;
}

function open(span) {
  var s = SENTS[String(span.dataset.id)];
  if (!s) return;
  if (openSpan === span) { closeCard(); return; }
  var holder = span._holder;
  closeCard();
  rove(span);
  openSpan = span;
  openHolder = holder;
  span.classList.add('open', 'seen');
  if (!holder) return;
  holder.innerHTML = '<div class="card">' + cardHTML(s) + '</div>';
  holder.hidden = false;
  var x = holder.querySelector('.x');
  if (x) x.onclick = function (e) { e.stopPropagation(); closeCard(); };
  seen[s.id] = 1;
  save();
  tip.classList.add('gone');
  requestAnimationFrame(function () {
    var r = holder.getBoundingClientRect();
    var bottom = window.innerHeight - 8;
    if (r.height > window.innerHeight - 24) return;
    if (r.bottom > bottom) window.scrollBy({ top: r.bottom - bottom, behavior: 'smooth' });
  });
}

function save() {
  try { localStorage.setItem(BOOK_KEY, JSON.stringify(seen)); } catch (e) {}
  var n = 0, ids = Object.keys(seen);
  for (var i = 0; i < ids.length; i++) if (SENTS[ids[i]]) n++;
  /* 进度按全书计（增量生成时进度条到不了 100% 是如实反映） */
  var denom = TOTAL || DATA.sentences.length;
  bar.style.width = (100 * Math.min(1, n / denom)) + '%';
  var head = DATA.subtitle ? DATA.subtitle + ' · ' : '';
  meta.textContent = PARTIAL
    ? head + '已覆盖 ' + DATA.sentences.length + '/' + TOTAL + ' 句 · 已读 ' + n + ' 句'
    : head + DATA.sentences.length + ' 句 · 已读 ' + n + ' 句';
}

/* 换行句子的行距间隙不参与 hit-test（点击会落到 <p> 上），
   兜底：按几何距离找最近的句子，保证点这一行任何位置都能命中 */
function sentenceAt(x, y, p) {
  var spans = p.querySelectorAll('.s');
  var best = null, bestD = Infinity;
  for (var i = 0; i < spans.length; i++) {
    var rs = spans[i].getClientRects();
    for (var k = 0; k < rs.length; k++) {
      var r = rs[k];
      var dx = x < r.left ? r.left - x : (x > r.right ? x - r.right : 0);
      var dy = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = spans[i]; }
    }
  }
  return bestD < 24 ? best : null;
}

book.addEventListener('click', function (e) {
  if (e.target.closest('.card')) return;
  var sp = e.target.closest('.s');
  if (!sp) {
    var p = e.target.closest('p.par');
    if (p) sp = sentenceAt(e.clientX, e.clientY, p);
  }
  if (sp) open(sp);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (!document.getElementById('panel').hidden) { document.getElementById('panel').hidden = true; return; }
    closeCard(); return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    var f = document.activeElement;
    if (f && f.classList && f.classList.contains('s')) {
      e.preventDefault();
      open(f);
    }
    return;
  }
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  var spans = Array.prototype.slice.call(book.querySelectorAll('.s'));
  var i = openSpan ? spans.indexOf(openSpan) : -1;
  if (e.key === 'ArrowRight') i = Math.min(i + 1, spans.length - 1);
  else i = Math.max(i - 1, 0);
  var t = spans[i];
  if (!t) return;
  e.preventDefault();
  rove(t);
  if (t.focus) t.focus({ preventScroll: true });
  var h = t._holder;
  if (openHolder && h && openHolder !== h) {
    /* 复用同一张卡：逐句推进时页面不跳动 */
    var html = '<div class="card">' + cardHTML(SENTS[String(t.dataset.id)]) + '</div>';
    openHolder.hidden = true;
    openHolder.innerHTML = '';
    closeCardSoft();
    openSpan = t;
    openHolder = h;
    t.classList.add('open', 'seen');
    h.innerHTML = html;
    h.hidden = false;
    var x = h.querySelector('.x');
    if (x) x.onclick = function (ev) { ev.stopPropagation(); closeCard(); };
    seen[t.dataset.id] = 1;
    save();
    requestAnimationFrame(function () {
      var r = h.getBoundingClientRect();
      if (r.top < 70) window.scrollBy({ top: r.top - 90, behavior: 'smooth' });
      else if (r.bottom > window.innerHeight - 8 && r.height < window.innerHeight - 24)
        window.scrollBy({ top: r.bottom - window.innerHeight + 8, behavior: 'smooth' });
    });
  } else {
    open(t);
    t.scrollIntoView({ block: 'center' });
  }
  tip.classList.add('gone');
});

save();
</script>
</body>
</html>
